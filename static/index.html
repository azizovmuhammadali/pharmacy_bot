<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zamin Farm Premium</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #000000);
  --hint: var(--tg-theme-hint-color, #999999);
  --link: var(--tg-theme-link-color, #2678b6);
  --button: var(--tg-theme-button-color, #2678b6);
  --button-text: var(--tg-theme-button-text-color, #ffffff);
  --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
  --header-bg: rgba(255, 255, 255, 0.8);
  --card-bg: rgba(255, 255, 255, 0.9);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  --radius: 20px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --header-bg: rgba(30, 30, 30, 0.8);
    --card-bg: rgba(40, 40, 40, 0.9);
    --secondary-bg: #1c1c1e;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text);
  padding-bottom: 80px;
  overflow-x: hidden;
}

/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--header-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding: 16px 20px;
  border-bottom: 1px solid rgba(0,0,0,0.05);
}
.header h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.header p { margin: 4px 0 0; font-size: 13px; color: var(--hint); }

/* Search */
.search-box {
  margin: 16px 20px;
  position: relative;
}
.search-box input {
  width: 100%; padding: 14px 20px 14px 48px;
  border-radius: 16px; border: none;
  background: var(--secondary-bg);
  color: var(--text); font-size: 15px;
  outline: none; transition: all 0.3s;
}
.search-box input:focus { box-shadow: 0 0 0 2px var(--button); }
.search-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  color: var(--hint);
}

/* Categories */
.categories {
  display: flex; gap: 12px; overflow-x: auto;
  padding: 0 20px 16px; scrollbar-width: none;
}
.categories::-webkit-scrollbar { display: none; }
.cat-chip {
  flex-shrink: 0; padding: 10px 20px;
  border-radius: 12px; background: var(--secondary-bg);
  font-size: 14px; font-weight: 600; color: var(--text);
  cursor: pointer; transition: all 0.2s;
}
.cat-chip.active { background: var(--button); color: var(--button-text); }

/* Grid */
.grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
  padding: 0 20px;
}
.card {
  background: var(--card-bg); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow);
  transition: transform 0.2s; cursor: pointer;
}
.card:active { transform: scale(0.97); }
.card-img {
  height: 120px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
}
.card-body { padding: 12px; }
.card-title { font-size: 14px; font-weight: 700; margin: 0 0 6px; line-height: 1.3; }
.card-price { font-size: 16px; font-weight: 800; color: var(--button); }

/* Bottom Nav */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--header-bg); backdrop-filter: blur(20px);
  display: flex; justify-content: space-around;
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid rgba(0,0,0,0.05); z-index: 100;
}
.nav-item {
  flex: 1; text-align: center; padding: 8px;
  color: var(--hint); font-size: 11px; font-weight: 600;
  cursor: pointer; transition: color 0.2s;
}
.nav-item.active { color: var(--button); }
.nav-icon { font-size: 22px; display: block; margin-bottom: 4px; }

/* Views */
.view { display: none; animation: fadeIn 0.3s; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Admin Panel */
.admin-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  padding: 20px;
}
.stat-card {
  background: var(--card-bg); padding: 20px; border-radius: var(--radius);
  box-shadow: var(--shadow); text-align: center;
}
.stat-num { font-size: 32px; font-weight: 800; color: var(--button); margin: 0; }
.stat-label { font-size: 13px; color: var(--hint); margin-top: 8px; }

/* Empty State */
.empty { text-align: center; padding: 60px 20px; color: var(--hint); }
.empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
</style>
</head>
<body>

<div class="header">
  <h1>💊 Zamin Farm</h1>
  <p>Premium Dorixona Xizmati</p>
</div>

<div class="search-box">
  <span class="search-icon">🔍</span>
  <input type="text" placeholder="Dori qidirish..." id="searchInput">
</div>

<div class="categories" id="categories">
  <div class="cat-chip active" data-id="">Hammasi</div>
</div>

<!-- Catalog View -->
<div id="view-catalog" class="view active">
  <div class="grid" id="productGrid"></div>
</div>

<!-- Cart View -->
<div id="view-cart" class="view">
  <div class="empty">
    <div class="empty-icon">🛒</div>
    <p>Savat bo'sh</p>
  </div>
</div>

<!-- Admin View (Faqat adminlar uchun) -->
<div id="view-admin" class="view">
  <div class="admin-stats">
    <div class="stat-card">
      <p class="stat-num" id="statProducts">0</p>
      <div class="stat-label">Mahsulotlar</div>
    </div>
    <div class="stat-card">
      <p class="stat-num" id="statOrders">0</p>
      <div class="stat-label">Buyurtmalar</div>
    </div>
  </div>
  <div style="padding: 0 20px;">
    <h3 style="margin-top: 30px;">So'nggi buyurtmalar</h3>
    <div id="adminOrdersList"></div>
  </div>
</div>

<nav class="nav">
  <div class="nav-item active" data-view="catalog">
    <span class="nav-icon">🏠</span>Katalog
  </div>
  <div class="nav-item" data-view="cart">
    <span class="nav-icon">🛒</span>Savat
  </div>
  <div class="nav-item" data-view="admin" id="adminTab" style="display: none;">
    <span class="nav-icon">⚙️</span>Admin
  </div>
</nav>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

// API Helper
async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'X-Telegram-Init-Data': tg.initData || ''
    }
  });
  if (!res.ok) throw new Error('API Error');
  return res.json();
}

// Navigation
document.querySelectorAll('.nav-item').forEach(item => {
  item.onclick = () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    
    const view = item.dataset.view;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + view).classList.add('active');
    
    if (view === 'admin') loadAdminData();
  };
});

// Load Categories
async function loadCategories() {
  try {
    const cats = await api('/categories');
    const container = document.getElementById('categories');
    cats.forEach(c => {
      const chip = document.createElement('div');
      chip.className = 'cat-chip';
      chip.textContent = c.name;
      chip.onclick = () => {
        document.querySelectorAll('.cat-chip').forEach(x => x.classList.remove('active'));
        chip.classList.add('active');
        loadProducts(c.id);
      };
      container.appendChild(chip);
    });
  } catch(e) {}
}

// Load Products
async function loadProducts(catId = '') {
  try {
    const url = catId ? `/products?category_id=${catId}` : '/products';
    const products = await api(url);
    const grid = document.getElementById('productGrid');
    grid.innerHTML = products.map(p => `
      <div class="card">
        <div class="card-img">💊</div>
        <div class="card-body">
          <h4 class="card-title">${p.name}</h4>
          <div class="card-price">${p.price} so'm</div>
        </div>
      </div>
    `).join('');
  } catch(e) {}
}

// Admin Data
async function loadAdminData() {
  try {
    const stats = await api('/admin/stats');
    document.getElementById('statProducts').textContent = stats.total_products;
    document.getElementById('statOrders').textContent = stats.total_orders;
    
    const orders = await api('/admin/orders');
    const list = document.getElementById('adminOrdersList');
    list.innerHTML = orders.map(o => `
      <div style="background: var(--card-bg); padding: 16px; border-radius: 16px; margin-bottom: 12px; box-shadow: var(--shadow);">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
          <b>#${o.id}</b>
          <span style="color: var(--button); font-weight: 700;">${o.total} so'm</span>
        </div>
        <div style="font-size: 13px; color: var(--hint);">Holat: ${o.status}</div>
      </div>
    `).join('');
  } catch(e) {}
}

// Check Admin
async function checkAdmin() {
  try {
    const me = await api('/me');
    // Agar admin_ids ro'yxatida bo'lsa (bu yerda soddalashtirilgan, aslida serverda tekshiriladi)
    // Hozircha hardcode qilib turamiz, keyin API orqali aniqroq qilamiz
    if (me.id === 8716186604) { // Sizning ID
      document.getElementById('adminTab').style.display = 'block';
    }
  } catch(e) {}
}

// Init
loadCategories();
loadProducts();
checkAdmin();
</script>
</body>
</html>
